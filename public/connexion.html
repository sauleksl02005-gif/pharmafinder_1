<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f6e">
  <title>Connexion | PharmaFinder Cameroun</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/connexion.js" defer></script>
</head>

<body>

<header class="topbar">
  <div class="nav-container">
    <a href="/" class="brand">
      <span class="brand-mark">+</span>
      <span>PharmaFinder <small>CAMEROUN</small></span>
    </a>

    <nav class="nav-links">
      <a href="/">Accueil</a>
      <a href="/inscription.html">Inscrire ma pharmacie</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="registration-section">

    <div class="section-heading">
      <span class="eyebrow">ESPACE UTILISATEUR</span>
      <h1>Connexion</h1>
      <p>
        Connectez-vous à votre compte PharmaFinder Cameroun.
      </p>
    </div>

    <form id="login-form" class="registration-form">

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Votre adresse e-mail"
        autocomplete="email"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="login-button">
        Se connecter
      </button>

      <p id="login-message" aria-live="polite"></p>

    </form>

    <p>
      Vous n'avez pas encore de compte ?
      <a href="/inscription-compte.html">Créer un compte</a>
    </p>

  </section>

</main>

<footer class="footer">
  <div class="footer-content">
    <p>© 2026 PharmaFinder Cameroun</p>
  </div>
</footer>

</body>
</html>
